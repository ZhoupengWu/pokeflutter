name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      # The release key (see README, "Release signing"). GitHub hides secrets from pull
      # requests opened from forks: these are then empty and the APK is debug-signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # TEMPORARY: exercises the signed-build path with a throwaway key.
      - name: Create a throwaway keystore
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass testpass \
            -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI test"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/test.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=testpass"
            echo "ANDROID_KEY_ALIAS=test"
            echo "ANDROID_KEY_PASSWORD=testpass"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      # A build that should be signed with the release key must not silently fall back
      # to the debug key (that APK could not update the installed app).
      - name: Show the signing certificate
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if [ -n "$ANDROID_KEYSTORE_PATH" ] && grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::A release key is configured but the APK is signed with the debug key"
            exit 1
          fi
          if [ -n "$ANDROID_KEYSTORE_PATH" ] && grep -q 'CN=CI test' certs.txt; then
            echo "TEMPORARY throwaway key was used, as expected"
          fi

      # Release builds have no debug-only permissions: the app talks to PokéAPI,
      # so a missing INTERNET permission must fail the build, not the users.
      - name: Check the merged manifest declares INTERNET
        run: |
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          echo "Checking $manifest"
          grep -q 'android.permission.INTERNET' "$manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
