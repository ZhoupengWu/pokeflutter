name: pokeflutter
description: "A Flutter Pokédex app — browse, search and explore Pokémon."
publish_to: 'none'

version: 1.11.0+10

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  flutter_svg: ^2.2.4
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  share_plus: ^12.0.0
  provider: ^6.1.5
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  assets:
    - assets/pokemonList.json
    - assets/pokemonNames.json
    - assets/pokeball.svg
    - assets/typesIcons/

# App icon: `python3 tool/generate_app_icon.py` draws the images, then
# `dart run flutter_launcher_icons` writes the Android and iOS icon files.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
