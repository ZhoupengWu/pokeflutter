name: pokeflutter
description: "A Flutter Pokédex app — browse, search and explore Pokémon."
publish_to: 'none'

version: 1.4.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  flutter_svg: ^2.2.4
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  assets:
    - assets/pokemonList.json
    - assets/pokeball.svg
    - assets/typesIcons/